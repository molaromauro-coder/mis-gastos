name: Verificar Mis Gastos

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validar sintaxis
        run: |
          node --check app.js
          node --check finance.js
          node --check resale-import.js
          node --check resale.js
      - name: Pruebas de comportamiento
        run: npm test
