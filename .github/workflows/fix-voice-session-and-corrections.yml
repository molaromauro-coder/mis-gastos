name: Fix voice session and corrections
on:
  push:
    paths:
      - '.github/scripts/fix-voice-session-and-corrections.py'
      - '.github/workflows/fix-voice-session-and-corrections.yml'
permissions:
  contents: write
jobs:
  patch-test-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: python .github/scripts/fix-voice-session-and-corrections.py
      - name: Check JavaScript syntax
        run: |
          node --check parser.js
          node --check app.js
      - name: Run all tests
        run: npm test
      - name: Verify voice rules
        run: |
          grep -q "voiceHoldActive" app.js
          grep -q "Seguí hablando" app.js
          grep -q "namedCandidates" parser.js
          grep -q "subcategories:state.subcategories" app.js
      - name: Commit tested result and remove one-time helpers
        run: |
          rm .github/scripts/fix-voice-session-and-corrections.py
          rm .github/workflows/fix-voice-session-and-corrections.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden long voice sessions and spoken corrections"
          git push
