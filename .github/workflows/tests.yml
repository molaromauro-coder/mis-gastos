name: Pruebas Mis Gastos

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxis JavaScript
        run: |
          node --check app.js
          node --check parser.js
          node --check reporting.js
          node --check finance.js
      - name: Ejecutar pruebas automáticas
        run: npm test
