name: Organize cards reorder and back
on:
  push:
    paths:
      - '.github/scripts/organize-cards-reorder-and-back.py'
      - '.github/workflows/organize-cards-reorder-and-back.yml'
permissions:
  contents: write
jobs:
  patch-test-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: python .github/scripts/organize-cards-reorder-and-back.py
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Run all tests
        run: npm test
      - name: Verify navigation and reorder rules
        run: |
          grep -q "Débito / Cuentas" index.html
          grep -q "cardColor" app.js
          grep -q "installPointerReorder" app.js
          grep -q "Cuenta Banco Macro" app.js
          grep -q "cardsBack" index.html
      - name: Commit tested result and remove one-time helpers
        run: |
          rm .github/scripts/organize-cards-reorder-and-back.py
          rm .github/workflows/organize-cards-reorder-and-back.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Organize payment methods and enable touch reordering"
          git push
