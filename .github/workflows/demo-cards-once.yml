name: Demo cards seed (one time)

on:
  push:
    paths:
      - '.github/workflows/demo-cards-once.yml'

permissions:
  contents: write

jobs:
  patch-test-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply demo card patch
        run: python3 .github/scripts/seed-demo-cards.py
      - name: Check JavaScript syntax
        run: node --check app.js && node --check parser.js
      - name: Run tests
        run: npm test
      - name: Commit tested result and remove one-time helpers
        run: |
          rm .github/scripts/seed-demo-cards.py .github/workflows/demo-cards-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Seed demo cards for testing and distinguish card types"
          git push
