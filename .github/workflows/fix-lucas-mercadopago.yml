name: Fix lucas and Mercado Pago
on:
  push:
    paths:
      - '.github/scripts/fix-lucas-mercadopago.py'
      - '.github/workflows/fix-lucas-mercadopago.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-test-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python .github/scripts/fix-lucas-mercadopago.py
      - name: Check JavaScript syntax
        run: node --check parser.js
      - name: Run tests
        run: npm test
      - name: Verify rules
        run: |
          grep -q "mercado.*pago" parser.js
          grep -q "luca y lucas equivalen" test/parser.test.js
          grep -q "Mercado Pago sin aclarar medio" test/parser.test.js
      - name: Commit tested result and remove one-time helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/scripts/fix-lucas-mercadopago.py
          rm .github/workflows/fix-lucas-mercadopago.yml
          git add parser.js test/parser.test.js .github/scripts/fix-lucas-mercadopago.py .github/workflows/fix-lucas-mercadopago.yml
          git commit -m "Support lucas and default Mercado Pago to debit"
          git push
