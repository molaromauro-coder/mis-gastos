name: Navigation feedback and subcategories once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-test-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python .github/scripts/apply-navigation-feedback-subcategories.py
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check parser.js
      - name: Run all tests
        run: npm test
      - name: Verify new interaction paths
        run: |
          grep -q 'data-pending-back="method"' app.js
          grep -q 'data-pending-back="card"' app.js
          grep -q 'function softTapFeedback' app.js
          grep -q 'subcategories:' app.js
          grep -q 'id="subcategory"' index.html
          grep -q 'id="quickSubcategory"' index.html
          grep -q "mis-gastos-v24" sw.js
      - name: Commit tested result and remove one-time helpers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html sw.js
          git rm .github/scripts/apply-navigation-feedback-subcategories.py .github/workflows/navigation-feedback-subcategories-once.yml
          git commit -m 'Add subcategories, pending back navigation and tap feedback'
          git push
