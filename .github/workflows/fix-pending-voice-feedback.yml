name: Fix pending voice feedback

on:
  push:
    paths:
      - '.github/workflows/fix-pending-voice-feedback.yml'

permissions:
  contents: write

jobs:
  patch-test-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python3 .github/scripts/fix-pending-voice-feedback.py
      - name: Check JavaScript syntax
        run: node --check app.js && node --check parser.js
      - name: Run tests
        run: npm test
      - name: Verify pending voice UI changes
        run: |
          grep -q "pendingVoiceStartCue" app.js
          grep -q "voiceAnswerPulse" styles.css
          grep -q "mis-gastos-v22" sw.js
      - name: Commit tested result and remove one-time helpers
        run: |
          rm .github/scripts/fix-pending-voice-feedback.py .github/workflows/fix-pending-voice-feedback.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add haptic audio and visual feedback to voice follow-ups"
          git push
