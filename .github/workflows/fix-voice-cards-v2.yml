name: Fix voice cards and cancel gesture v2

on:
  push:
    paths:
      - '.github/workflows/fix-voice-cards-v2.yml'

permissions:
  contents: write

jobs:
  patch-test-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python3 .github/scripts/fix-voice-cards-v2.py
      - name: Check JavaScript syntax
        run: node --check app.js && node --check parser.js && node --check finance.js
      - name: Run tests
        run: npm test
      - name: Commit tested result and remove one-time helpers
        run: |
          rm .github/scripts/fix-voice-cards-v2.py .github/workflows/fix-voice-cards-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix iPhone voice follow-ups, demo cards and cancel gesture"
          git push
